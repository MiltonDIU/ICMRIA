<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment System</title>
    <style>
        /* Your CSS styles here */
    </style>
</head>
<body>
<div class="comment">
    <p>Comment content...</p>
    <span class="reply-button" onclick="toggleReplyForm(this)">Reply</span>
    <form class="reply-form" style="display:none;">
        <textarea></textarea>
        <button>Submit</button>
    </form>
</div>

<div class="comment">
    <p>Another comment content...</p>
    <span class="reply-button" onclick="toggleReplyForm(this)">Reply</span>
    <form class="reply-form" style="display:none;">
        <textarea></textarea>
        <button>Submit</button>
    </form>
</div>

<script>
    function toggleReplyForm(replyButton) {
        var replyForm = replyButton.nextElementSibling;
        if (replyForm.classList.contains("reply-form")) {
            if (replyForm.style.display === "none") {
                replyForm.style.display = "block";
            } else {
                replyForm.style.display = "none";
            }
        }
    }
</script>
</body>
</html>
